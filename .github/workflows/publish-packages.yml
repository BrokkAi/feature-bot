name: Publish packages
run-name: Release ${{ inputs.tag || github.ref_name }} (publish=${{ github.event_name == 'push' || inputs.publish }})
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Proposed version; a tag is only required for publication
        required: true
        type: string
      publish:
        description: Publish the exact existing tag after all gates pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: feature-bot-packages
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/release.yml
  packages:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: packages-publish
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TARGET: ${{ github.sha }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require explicit publication context
        run: |
          if [ "$RELEASE_PUBLISH" = true ]; then
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Build every native and npm deliverable and smoke test installation
        run: python3 scripts/release_preflight.py build
      - name: Check every destination for version conflicts
        run: python3 scripts/release_preflight.py version
      - name: Check actual GitHub and npm publishing identities without uploads
        if: env.RELEASE_PUBLISH != 'true'
        run: python3 scripts/release_preflight.py authorize-job
      - name: Save exact-commit preflight evidence and staged bytes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: preflight-${{ env.RELEASE_TAG }}
          path: dist/preflight/${{ github.sha }}/${{ env.RELEASE_TAG }}/
          if-no-files-found: error
          retention-days: 30
      - name: Resume publication and finalize only after every destination is complete
        if: env.RELEASE_PUBLISH == 'true'
        run: python3 scripts/release_preflight.py publish
